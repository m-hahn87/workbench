[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "workbench-context-store"
version = "0.1.0"
description = "Git-native, Markdown-first project context store for humans and AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "markdown-it-py>=4,<5",
  "mcp>=1.28.1,<2",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "ruamel.yaml>=0.18,<0.19",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
  "watchfiles>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "httpx2>=2.7,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
workbench = "workbench.adapters.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["workbench"]
